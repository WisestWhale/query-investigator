name: query-investigator

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: querydev
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: query_lab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U querydev -d query_lab"]
      interval: 2s
      timeout: 3s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: learner@example.com
      PGADMIN_DEFAULT_PASSWORD: localadmin
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:

name: query-investigator

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: querydev
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: query_lab
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U querydev -d query_lab"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
